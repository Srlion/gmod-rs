[package]
name = "gmod"
version = "17.0.0"
authors = ["William Venner <william@venner.io>"]
edition = "2021"
license = "MIT"
description = "A swiss army knife for creating binary modules for Garry's Mod in Rust"
repository = "https://github.com/WilliamVenner/gmod-rs"
keywords = ["gmod", "garrysmod", "module", "glua"]
categories = [
    "api-bindings",
    "external-ffi-bindings",
    "game-development",
    "development-tools",
]

[features]
default = []
tokio-tasks = ["dep:tokio", "dep:tokio-util"]

[dependencies]
anyhow = "1.0.89"
defer = "0.2.1"
gmod-macros = { version = "2.0.1", path = "../gmod-macros" }
libloading = "0.8"
linkme = "0.3.31"
paste = "1.0.15"

tokio = { version = "1", optional = true, default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
] }
tokio-util = { version = "0.7", optional = true, default-features = false, features = [
    "rt",
] }
